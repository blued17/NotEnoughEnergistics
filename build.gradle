buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'eclipse'
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = 'com.github.vfyjxf.neenergistics'
archivesBaseName = mod_archives_name

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    mappings channel: 'parchment', version: '2021.10.17-1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                neenergistics { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                neenergistics { source sourceSets.main }
            }
        }
        data {
            workingDirectory project.file('run')
            args '--mod', 'neenergistics', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                neenergistics { source sourceSets.main }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    maven { url = 'https://maven.minecraftforge.net/' }

    maven {
        name = 'Modmaven'
        url = 'https://modmaven.dev/'
    }

    maven {
        name = 'JEI'
        url = 'https://dvs1.progwml6.com/files/maven/'
    }

    maven {
        name = 'ModMaven-K4U'
        url = 'https://modmaven.k-4u.nl/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.16.5-${forge_version}"

    compileOnly fg.deobf("mezz.jei:jei-${mc_version}:${jei_version}")
    compileOnly fg.deobf("appeng:appliedenergistics2:${appeng_version}")
    compileOnly fg.deobf("de.mari_023:ae2wtlib:${ae2wtlib_version}")

    runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}:${jei_version}")
    runtimeOnly fg.deobf("appeng:appliedenergistics2:${appeng_version}")
    runtimeOnly fg.deobf("de.mari_023:ae2wtlib:${ae2wtlib_version}")
}

processResources {
    inputs.property 'version', project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

jar {
    appendix mc_version
    manifest.attributes(
            "Specification-Title": "neenergistics",
            "Specification-Vendor": "vfyjxf",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${mod_version}",
            "Implementation-Vendor": "vfyjxf"
    )
}
jar.finalizedBy('reobfJar')
